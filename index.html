<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="author" content="thebestpnlmaker">
<meta name="theme-color" content="#0B3F2F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-maskable-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heads or Tails">
<title>Heads or Tails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --felt: #136B4E;
    --felt-deep: #0B3F2F;
    --brass-light: #F1D98A;
    --ivory: #F2EBD3;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 45%, var(--felt) 0%, var(--felt-deep) 80%);
    background-color: var(--felt-deep);
    color: var(--ivory);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  h1 {
    margin: 3.5rem 0 0;
    font-size: clamp(2rem, 9vw, 3.2rem);
    font-weight: 800; letter-spacing: -0.02em; line-height: 1; text-align: center;
  }
  .stage {
    flex: 1; width: 100%;
    display: flex; align-items: center; justify-content: center;
    perspective: 1100px; position: relative;
  }
  .shadow {
    position: absolute;
    width: min(56vw, 240px); height: 26px;
    top: calc(50% + min(31vw, 130px) + 6px);
    left: 50%; transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 70%);
  }
  .coin {
    width: min(62vw, 260px); aspect-ratio: 1;
    position: relative; transform-style: preserve-3d;
  }
  .face, .edge { position: absolute; inset: 0; border-radius: 50%; }
  .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; filter: drop-shadow(0 0 0 transparent); }
  .face svg { width: 100%; height: 100%; display: block; }
  .front { transform: translateZ(6px); }
  .back { transform: rotateX(180deg) translateZ(6px); }
  .edge { background: repeating-conic-gradient(#8A6410 0deg 2deg, #C99A2E 2deg 4deg); }
  .result {
    min-height: 3.5rem;
    font-size: clamp(2rem, 10vw, 3rem); font-weight: 700; text-align: center;
    opacity: 0; transition: opacity .25s;
  }
  .result.show { opacity: 1; }
  .hint { margin: 0 0 .4rem; font-size: 1rem; opacity: .7; text-align: center; }
  .credit { margin: 0 0 1.2rem; font-size: .8rem; opacity: .45; letter-spacing: .02em; }
  .install {
    display: none; margin: 0 0 .8rem;
    font: 700 .95rem "Bricolage Grotesque", system-ui, sans-serif;
    color: #0B3F2F; background: var(--ivory); border: 0; border-radius: 999px;
    padding: .6rem 1.2rem; cursor: pointer;
  }
  .install.show { display: inline-block; }
  .dot {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); right: 10px;
    width: 4px; height: 4px; border-radius: 50%; background: var(--ivory); opacity: 0;
  }
  .dot.on { opacity: .35; }
  .lang {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px;
    font: 700 .9rem "Bricolage Grotesque", system-ui, sans-serif;
    color: var(--ivory); background: rgba(0,0,0,.25);
    border: 1px solid rgba(242,235,211,.35); border-radius: 999px;
    padding: .45rem .8rem; cursor: pointer;
  }
  .pick {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px;
    width: 40px; height: 40px; padding: 3px; border-radius: 50%;
    background: rgba(0,0,0,.25); border: 1px solid rgba(242,235,211,.35); cursor: pointer;
  }
  .pick svg, .opt svg { width: 100%; height: 100%; display: block; }
  .panel {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 58px); right: 12px;
    display: none; gap: 10px; padding: 10px;
    background: rgba(5,35,26,.92); border: 1px solid rgba(242,235,211,.25); border-radius: 16px;
  }
  .panel.open { display: flex; }
  .opt {
    width: 72px; padding: 6px 4px; background: none; border: 2px solid transparent; border-radius: 12px;
    color: var(--ivory); font: 700 .8rem "Bricolage Grotesque", system-ui, sans-serif; cursor: pointer;
  }
  .opt .thumb { width: 56px; height: 56px; margin: 0 auto 4px; }
  .opt.sel { border-color: var(--brass-light); }
  .pick:focus-visible, .opt:focus-visible { outline: 2px solid var(--brass-light); outline-offset: 2px; }
  .lang:focus-visible { outline: 2px solid var(--brass-light); outline-offset: 2px; }
</style>
</head>
<body>
  <h1 id="title">Heads or Tails</h1>
  <div class="stage">
    <div class="shadow" id="shadow"></div>
    <div class="coin" id="coin">
      <div class="edge" style="transform:translateZ(-5px)"></div><div class="edge" style="transform:translateZ(-4px)"></div><div class="edge" style="transform:translateZ(-3px)"></div><div class="edge" style="transform:translateZ(-2px)"></div><div class="edge" style="transform:translateZ(-1px)"></div><div class="edge" style="transform:translateZ(0px)"></div><div class="edge" style="transform:translateZ(1px)"></div><div class="edge" style="transform:translateZ(2px)"></div><div class="edge" style="transform:translateZ(3px)"></div><div class="edge" style="transform:translateZ(4px)"></div><div class="edge" style="transform:translateZ(5px)"></div>
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div>
  </div>
  <div class="result" id="result">&nbsp;</div>
  <p class="hint" id="hint">Tap the screen to flip</p>
  <button class="install" id="install" type="button">Install app</button>
  <p class="credit">by thebestpnlmaker</p>
  <div class="dot" id="dot"></div>
  <button class="lang" id="lang" type="button">FR</button>
  <button class="pick" id="pick" type="button" aria-label="Choose coin"></button>
  <div class="panel" id="panel"></div>

  }
  langBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  langBtn.addEventListener('click', (e) => {

    shadow.animate([
      { transform: 'translateX(-50%) scale(1)', opacity: 1 },
      { transform: 'translateX(-50%) scale(.45)', opacity: .35, offset: 0.5 },
      { transform: 'translateX(-50%) scale(1)', opacity: 1 }
    ], { duration, easing });
  }
</script>
